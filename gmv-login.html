<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>访问验证 · GainmapVideo</title>
  <meta name="description" content="输入访问密码以查看本页。">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080d; --panel: #111620; --panel-2: #172131;
      --ink: #f4f7fb; --muted: #a7b0bf; --soft: #758195;
      --line: rgba(255,255,255,.12);
      --cyan: #34dff2; --lime: #b7f05b; --rose: #ff4d6d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--ink);
      font: 16px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
      background:
        radial-gradient(circle at 14% 12%, rgba(52,223,242,.16), transparent 30%),
        radial-gradient(circle at 84% 10%, rgba(255,77,109,.12), transparent 32%),
        radial-gradient(circle at 60% 90%, rgba(183,240,91,.10), transparent 36%),
        linear-gradient(180deg, #07080d 0%, #0b1019 48%, #07080d 100%);
    }
    html[lang^="zh"] [data-lang="en"] { display: none; }
    html[lang="en"] [data-lang="zh"] { display: none; }
    .card {
      width: 100%; max-width: 412px; background: rgba(17,22,32,.86);
      border: 1px solid var(--line); border-radius: 18px; padding: 34px 30px 30px;
      backdrop-filter: blur(16px); box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .logo {
      font-size: 17px; font-weight: 800;
      background: linear-gradient(100deg, var(--cyan), var(--lime));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lang-toggle {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    .lang-toggle:hover { color: var(--ink); border-color: rgba(255,255,255,.3); }
    h1 { font-size: 22px; letter-spacing: .01em; margin-bottom: 6px; }
    .sub { color: var(--soft); font-size: 13.5px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 7px 2px; }
    input {
      width: 100%; background: var(--panel-2); border: 1px solid var(--line);
      color: var(--ink); border-radius: 11px; padding: 13px 14px; font-size: 15px;
      outline: none; transition: border-color .15s;
    }
    input:focus { border-color: var(--cyan); }
    input::placeholder { color: #5c6677; }
    .msg { min-height: 20px; font-size: 13px; margin: 8px 2px 0; }
    .msg.err { color: var(--rose); }
    .msg.ok { color: var(--lime); }
    button.primary {
      width: 100%; margin-top: 14px; border: none; cursor: pointer;
      background: linear-gradient(100deg, var(--cyan), var(--lime)); color: #04121a;
      font-weight: 800; font-size: 15px; border-radius: 11px; padding: 13px;
      transition: filter .15s, opacity .15s;
    }
    button.primary:hover { filter: brightness(1.06); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; filter: none; }
    .hint { color: var(--soft); font-size: 12.5px; margin-top: 18px; text-align: center; }
    .hint a { color: var(--cyan); }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <span class="logo">影像色彩与显示技术指南</span>
      <button class="lang-toggle" id="langToggle" type="button">EN</button>
    </div>

    <h1><span data-lang="zh">访问验证</span><span data-lang="en">Access required</span></h1>
    <p class="sub">
      <span data-lang="zh">本页(GainmapVideo)需要访问密码。</span>
      <span data-lang="en">This page (GainmapVideo) is password-protected.</span>
    </p>

    <div>
      <label>
        <span data-lang="zh">访问密码</span><span data-lang="en">Access password</span>
      </label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>

    <div class="msg" id="msg"></div>

    <button class="primary" id="enterBtn" type="button">
      <span data-lang="zh">进入</span><span data-lang="en">Enter</span>
    </button>

    <p class="hint">
      <a href="index.html">
        <span data-lang="zh">← 返回首页</span><span data-lang="en">← Back to home</span>
      </a>
    </p>
  </main>

  <script src="assets/auth/gmv-config.js"></script>
  <script>
    (function () {
      var cfg = window.AUTH_CONFIG || {};
      var API = cfg.AUTH_API_BASE || '';
      var TOKEN_KEY = cfg.TOKEN_KEY || 'gmvAuthToken';

      var pwEl = document.getElementById('pw');
      var enterBtn = document.getElementById('enterBtn');
      var msg = document.getElementById('msg');
      var langToggle = document.getElementById('langToggle');

      function isEN() { return (localStorage.getItem('guideLang') || 'zh') === 'en'; }
      function applyLang() {
        var en = isEN();
        document.documentElement.lang = en ? 'en' : 'zh-CN';
        langToggle.textContent = en ? '中' : 'EN';
      }
      langToggle.addEventListener('click', function () {
        localStorage.setItem('guideLang', isEN() ? 'zh' : 'en');
        applyLang(); showMsg('', '');
      });
      applyLang();

      function T(zh, en) { return isEN() ? en : zh; }
      function showMsg(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }

      function safeNext() {
        var n = new URLSearchParams(location.search).get('next');
        if (!n) { try { n = sessionStorage.getItem('postLoginNext'); } catch (e) {} }
        try { sessionStorage.removeItem('postLoginNext'); } catch (e) {}
        if (!n) return 'gainmapvideo-player.html';
        try { n = decodeURIComponent(n); } catch (e) {}
        if (/^https?:/i.test(n) || n.indexOf('//') === 0 || n.indexOf('..') >= 0) return 'gainmapvideo-player.html';
        return n;
      }

      try { if (localStorage.getItem(TOKEN_KEY)) location.replace(safeNext()); } catch (e) {}

      function submit() {
        var pw = pwEl.value;
        if (!pw) { showMsg(T('请输入密码', 'Enter the password'), 'err'); return; }
        enterBtn.disabled = true;
        showMsg(T('验证中…', 'Checking…'), '');
        fetch(API + '/api/password-login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok || !res.d.token) {
              enterBtn.disabled = false;
              showMsg(res.d.error || T('密码不正确', 'Wrong password'), 'err');
              return;
            }
            try { localStorage.setItem(TOKEN_KEY, res.d.token); } catch (e) {}
            showMsg(T('通过,正在进入…', 'OK, entering…'), 'ok');
            location.replace(safeNext());
          })
          .catch(function () {
            enterBtn.disabled = false;
            showMsg(T('网络错误,请稍后再试', 'Network error, try again'), 'err');
          });
      }
      enterBtn.addEventListener('click', submit);
      pwEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    })();
  </script>
</body>
</html>
